version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns: ['org.springframework*']
    # Spring Boot 4 (and springdoc 3, which needs it) is a planned migration, not a bot bump.
    # The Maven wrapper stays on the 3.9 line, like the Docker build image.
    ignore:
      - dependency-name: org.apache.maven:apache-maven
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: org.springframework.boot:spring-boot-starter-parent
        update-types: ['version-update:semver-major']
      - dependency-name: org.springdoc:springdoc-openapi-starter-webmvc-ui
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns: ['@angular*', '@ngrx*']
    # Toolchain majors are upgraded deliberately (they need an Angular CLI release that supports them), not by bot.
    # Angular 22 needs TypeScript 6 and angular-eslint 22 at the same time, so it is one planned migration.
    ignore:
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@ngrx/*'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: vitest
        update-types: ['version-update:semver-major']
      - dependency-name: angular-eslint
        update-types: ['version-update:semver-major']
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    # Runtime images stay on LTS lines (JDK 25); a new LTS is adopted on purpose.
    ignore:
      - dependency-name: maven
        update-types: ['version-update:semver-major']
      - dependency-name: eclipse-temurin
        update-types: ['version-update:semver-major']
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    # Node stays on an LTS line supported by the Angular CLI.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
