global:
  scrape_interval: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The management port (8081) is reachable only inside the Compose network; it is never published.
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['backend:8081']
