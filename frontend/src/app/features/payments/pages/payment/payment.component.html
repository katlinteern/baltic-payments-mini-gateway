<ui-page>
  @if (busy()) {
    <mat-progress-bar mode="indeterminate" aria-label="Working on your payment" />
  }
  @if (error()) {
    <ui-alert>{{ error() }}</ui-alert>
  }
  <div class="layout">
    @if (view() !== 'ended') {
      <ui-stepper [steps]="steps" [current]="step()" label="Payment progress" />
    }
    @switch (screen()) {
      @case ('form') {
        <app-payment-form [form]="form" [accounts]="accounts()" [busy]="busy()" (submitted)="submit($event)" />
      }
      @case ('review') {
        @if (currentPayment(); as payment) {
          <app-payment-review
            [payment]="payment"
            [busy]="busy()"
            [waiting]="waiting()"
            (confirmed)="confirm($event)"
            (edited)="edit()"
          />
        }
      }
      @default {
        <mat-card class="step-card">
          <ui-section-head [heading]="endedHeading()" [bordered]="true" />
          <div class="step-body">
            <ui-alert [kind]="currentPayment()?.status === 'COMPLETED' ? 'success' : 'warning'">{{
              endedMessage()
            }}</ui-alert>
            @if (currentPayment()?.status !== 'COMPLETED') {
              <div class="actions">
                <button mat-stroked-button type="button" (click)="edit()" [disabled]="busy()">Edit payment</button>
                <button mat-flat-button color="primary" type="button" (click)="retry()" [disabled]="busy()">
                  Try again
                </button>
              </div>
            }
          </div>
        </mat-card>
      }
    }
  </div>
</ui-page>
