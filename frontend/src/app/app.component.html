<div class="shell" [class.authed]="auth.isLoggedIn()">
  @if (auth.isLoggedIn()) {
    <header class="topbar">
      <div class="brand-row">
        <a class="brand" routerLink="/accounts" aria-label="balticpay home"><ui-logo [inverse]="true" /></a>
        <span class="demo-tag">Demo</span>
      </div>
      <nav class="main-nav" aria-label="Main navigation">
        <a routerLink="/accounts" routerLinkActive="active"
          ><mat-icon aria-hidden="true">account_balance_wallet</mat-icon><span>Accounts</span></a
        >
        <a routerLink="/payments" routerLinkActive="active"
          ><mat-icon aria-hidden="true">swap_horiz</mat-icon><span>Payments</span></a
        >
        <a routerLink="/transactions" routerLinkActive="active"
          ><mat-icon aria-hidden="true">receipt_long</mat-icon><span>Activity</span></a
        >
      </nav>
      <span class="grow"></span>
      <div class="account">
        <span class="identity">
          <span class="avatar" aria-hidden="true">{{ auth.username().slice(0, 1).toUpperCase() }}</span>
          <span class="who">{{ auth.username() }}</span>
        </span>
        <button class="signout" type="button" aria-label="Sign out" title="Sign out" (click)="logout()">
          <mat-icon aria-hidden="true">logout</mat-icon>
        </button>
      </div>
    </header>
  }
  <div class="content"><router-outlet /></div>
</div>
