server_tokens off;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  client_max_body_size 64k;

  include /etc/nginx/security-headers.conf;

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # nginx is the edge: overwrite rather than append so clients cannot spoof their address.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  # Operational endpoints are never exposed; without this the SPA fallback would answer 200 with index.html.
  location /actuator/ {
    return 404;
  }

  # The service worker script and its manifest must always be revalidated or clients never see new releases.
  location ~ ^/(ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js)$ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # Fingerprinted bundles are immutable; the SPA shell must always be revalidated.
  location ~* \.(?:js|css|woff2?)$ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
