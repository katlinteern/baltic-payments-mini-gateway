spring:
  datasource:
    password: ${DB_PASSWORD:payments-dev-only}
  liquibase:
    contexts: local
app:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-this-32chars-minimum}
  # A stand-in for Smart-ID that approves every payment after a short delay. Demo only: it verifies nothing.
  strong-auth:
    mock:
      enabled: true
      delay: PT3S
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
