spring:
  datasource:
    password: ${DB_PASSWORD:payments-dev-only}
  liquibase:
    contexts: local
app:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-this-32chars-minimum}
  strong-auth:
    mock:
      enabled: true
      delay: PT3S
      outcome: ${STRONG_AUTH_MOCK_OUTCOME:APPROVED}
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
