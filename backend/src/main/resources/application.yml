spring:
  application:
    name: baltic-payments-gateway
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${DB_USER:payments}
    password: ${DB_PASSWORD}
    hikari:
      # Row locks give up after 3 s instead of queueing forever and exhausting the pool (PostgreSQL SQLSTATE 55P03).
      connection-init-sql: SET lock_timeout = '3s'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    # Demo seed data is tagged local/test and must never run unless explicitly requested.
    contexts: ${LIQUIBASE_CONTEXTS:prod}
  mvc:
    problemdetails:
      enabled: true
  web:
    resources:
      add-mappings: false
server:
  shutdown: graceful
  # Client IP comes from X-Forwarded-For, which Tomcat only honours from private-network proxies (nginx).
  forward-headers-strategy: native
logging:
  structured:
    format:
      console: logstash
management:
  # Operational endpoints live on a separate port that is never published or proxied.
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      probes:
        enabled: true
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 60
  login-rate-limit:
    max-failures: 5
    max-failures-per-ip: 20
    max-failures-per-username: 20
    window-minutes: 15
  # Per user and minute. The name check reveals whether a guessed name matches, so it is limited tightly.
  rate-limit:
    payments-per-minute: 60
    payee-verifications-per-minute: 20
  payments:
    ttl: PT10M
    authentication-ttl: PT2M
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
